services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: fraud-zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: fraud-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 1
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10

  kafka-topic-init:
    image: confluentinc/cp-kafka:7.6.1
    container_name: fraud-kafka-topic-init
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - /bin/bash
      - -c
      - |
        set -e
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic transactions --partitions 1 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic fraud-results --partitions 1 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --list

  api:
    build: .
    container_name: fraud-api
    depends_on:
      kafka-topic-init:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    environment:
      MODEL_PATH: model/artifacts/demo_model.pkl
      SCORING_MODEL: auto
      KAFKA_BROKER: kafka:29092
      STRUCTURED_LOGS: "true"
      LOG_LEVEL: INFO
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  producer:
    build: .
    container_name: fraud-producer
    depends_on:
      kafka-topic-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BROKER: kafka:29092
      PRODUCER_RATE: ${PRODUCER_RATE:-25}
      DEMO_ROWS: ${DEMO_ROWS:-5000}
      DEMO_FRAUD_RATE: ${DEMO_FRAUD_RATE:-0.02}
    command:
      - /bin/bash
      - -c
      - |
        python scripts/generate_demo_data.py --rows $${DEMO_ROWS:-5000} --fraud-rate $${DEMO_FRAUD_RATE:-0.02} --output data/creditcard.csv
        python streaming/producer.py --rate $${PRODUCER_RATE:-25}

  consumer:
    build: .
    container_name: fraud-consumer
    depends_on:
      api:
        condition: service_healthy
      kafka-topic-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BROKER: kafka:29092
      API_URL: http://api:8000
      API_SCORE_PATH: /analyst/score
      STRUCTURED_LOGS: "true"
      LOG_LEVEL: INFO
